<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>

<body>

    <h1>Cadastro</h1>

    <form onsubmit="event.preventDefault(); alert('Cadastro realizado com sucesso!'); window.location.href='login.html';">

        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome">

        <br><br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail">

        <br><br>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha">

        <br><br>

        <label for="confirmar-senha">Confirmar senha:</label>
        <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Digite sua senha novamente">

        <br><br>

        <button type="submit">Cadastrar</button>

    </form>

    <p>
        Já possui uma conta?
        <a href="login.html">Voltar para o login</a>
    </p>

</body>
</html>
