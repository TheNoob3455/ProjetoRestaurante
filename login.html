<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style-login.css">
    <link rel="shortcut icon" href="img/Logo-Circular-Chapa-Quente.ico" type="image/x-icon">
    
</head>

<body>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    
    <div class="boxzinho">
        <img src="img/Ícone de Usuário Neon em Vidro.png" alt="">
    <h1>Entrar</h1>
    <p class="topo">Entre na sua conta para continuar</p>

<form id="form-login">
    
    <div class="email">
        <img src="img/Ícone de Envelope Branco Minimalista.png" alt="">
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail">
    </div>
    
    <p id="erroEmail"></p>
            
    <div class="senha">
        <img src="img/Ícone de Cadeado Branco Minimalista.png" alt="">
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha">
        <button type="button" id="mostrar" class="mostrarsenha"></button>
    </div>
    
            <p id="erroSenha"></p>
    
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAFwJ3SDm_0wdNBwN"></div>
    
            <button type="button" id="login">Entrar</button>
</form>
    
    <p>
        Ainda não possui uma conta?
        <a href="cadastro.html">Cadastre-se</a>
    </p>
    
</div>

</body>
</html>

<script type="module"> 

    import { validarEmail } from './funcoes.js';
    import { pegarFetch, verificarADM } from './fetchs.js';

    let mostrar = document.getElementById("mostrar");
    let senhaOculta = document.getElementById("senha");
    let confirmarOculta = document.getElementById("confirmar-senha");
    let mostrar2 = document.getElementById("mostrar2");
    
    let ocultar1 = 0;
    let ocultar2 = 0;

    mostrar.addEventListener("click", function(){
        if(ocultar1 === 1){
            mostrar.style.backgroundImage = "url('img/Ícone de olho oculto minimalista.png')";
            senhaOculta.type = "password";
            ocultar1 = 0;
        } else {
            mostrar.style.backgroundImage = "url('img/Ícone de Olho Branco Minimalista.png')";
            senhaOculta.type = "text";
            ocultar1 = 1;
        }
    });



    let botao = document.getElementById("login");
    botao.addEventListener("click", async function(event){
        event.preventDefault();
        
        const form = document.getElementById('form-login');
        const formData = new FormData(form);
        let token = formData.get('cf-turnstile-response');
        
        let senha = document.getElementById("senha").value;
        let email = document.getElementById("email").value;
        
        
        let erroSenha = document.getElementById("erroSenha");
        let erroEmail = document.getElementById("erroEmail");

        let senhaValidada = false;
        let emailValidado = false;

        if (email === "" || !validarEmail(email)) {
            erroEmail.textContent = "O e-mail não é válido.";
            erroEmail.style.color = "white";
            emailValidado = false;
        } else {
            erroEmail.textContent = "";
            emailValidado = true;

        }
        
        
        if (senha.length < 5) {
            erroSenha.textContent = "A senha tem que ter no mínimo 5 caracteres.";
            erroSenha.style.color = "white";
            senhaValidada = false;
        } else {
            erroSenha.textContent = "";
            senhaValidada = true;
        }

        let respostaADM = await verificarADM(email, senha)

        if(respostaADM == true){
            window.location.href = "principal.html";
        }
        
        if (senhaValidada && emailValidado) {
            let resultado = await pegarFetch(email, senha, token);
            if (resultado == true) {
                    console.log("login realizado com sucesso!");
                    window.location.href = "principal.html";
                    localStorage.setItem("usuarioEmail", email);
                    localStorage.setItem("senhaUsuario", senha);
                
                } else if (resultado == "email") {
                    console.log("Erro ao fazer login - email");
                    erroEmail.textContent = "Não existe nenhum cliente com esse e-mail";
                    erroEmail.style.color = "white";
                
                    turnstile.reset();
                } else if (resultado == "senha") {
                    console.log("Erro ao fazer login - senha");
                    erroSenha.textContent = "Senha incorreta.";
                    erroSenha.style.color = "white";

                    turnstile.reset()
                }
        }
    });
</script>
