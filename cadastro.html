<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="shortcut icon" href="img/Logo-Circular-Chapa-Quente.ico">
    <link rel="stylesheet" href="style-cadastro.css">

</head>

<body>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <div class="boxzinho">
    <img src="img/Ícone Glossy de Adicionar Usuário.png" alt="">
    <h1>Cadastro</h1>
    <p class="topo">
        Crie sua conta para começar
    </p>

    <form>

    <div class="nome">
        <img src="img/Ícone_de_usuário_branco_brilhante-removebg-preview.png" alt="">
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
    </div>

    <p id="erronome"></p>

    <div class="e-mail">
        <img src="img/Ícone de Envelope Branco Minimalista.png" alt="">
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" autocomplete="off">
    </div>

    <p id="erroEmail"></p>

    <div class="senha">
        
        <img src="img/Ícone de Cadeado Branco Minimalista.png" alt="">
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha">
        <button type="button" id="mostrar" class="mostrarsenha"></button>
        

    </div>

    <p id="errosenha"></p>

    <div class="c-senha">
        <img src="img/Ícone de Cadeado Branco Minimalista.png" alt="">
        <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Digite sua senha novamente">
        <button type="button" id="mostrar2" class="mostrarsenha-2"></button>

    </div>
    <p id="senhaigual"></p>


    <div>
        <button type="button" id="cadastro">Cadastrar</button>
    </div>

    </form>

    <p>
        Já possui uma conta?
        <a href="login.html">Entrar</a>
    </p>
  <form id="form-cadastro">
    <div class="cf-turnstile" data-sitekey="0x4AAAAAAFwJ3SDm_0wdNBwN"></div>
    </form>
        
    </div>
  
    <script type="module">

    import { darFetch, Emailexiste } from './fetchs.js';
    import { validarEmail } from './funcoes.js';

    let mostrar = document.getElementById("mostrar");
    let senhaOculta = document.getElementById("senha");
    let confirmarOculta = document.getElementById("confirmar-senha");
    let mostrar2 = document.getElementById("mostrar2");
    
    let ocultar1 = 0;
    let ocultar2 = 0;

    mostrar.addEventListener("click", function(){
        if(ocultar1 === 1){
            mostrar.style.backgroundImage = "url('img/Ícone de olho oculto minimalista.png')";
            senhaOculta.type = "password";
            ocultar1 = 0;
        } else {
            mostrar.style.backgroundImage = "url('img/Ícone de Olho Branco Minimalista.png')";
            senhaOculta.type = "text";
            ocultar1 = 1;
        }
    });

    mostrar2.addEventListener("click", function(){
        if(ocultar2 === 1){
            mostrar2.style.backgroundImage = "url('img/Ícone de olho oculto minimalista.png')";
            confirmarOculta.type = "password";
            ocultar2 = 0;
        } else {
            mostrar2.style.backgroundImage = "url('img/Ícone de Olho Branco Minimalista.png')";
            confirmarOculta.type = "text";
            ocultar2 = 1;
        }
    });

    let botao = document.getElementById("cadastro");
    botao.addEventListener("click", async function(event){
        event.preventDefault();
    
        let cpf = "577.084.860-09";
        let nome = document.getElementById("nome").value;
        let senha = document.getElementById("senha").value;
        let email = document.getElementById("email").value;
        let resenha = document.getElementById("confirmar-senha").value;
        
        let erroSenha = document.getElementById("errosenha");
        let erroNome = document.getElementById("erronome");
        let senhaIgual = document.getElementById("senhaigual");
        let erroEmail = document.getElementById("erroEmail");

        const URL = 'https://projeto-restaurante-backend-5mhl.onrender.com/cliente';
    
        let senhaValidada = false;
        let nomeValidado = false;
        let emailValidado = false;
    
            
        if (nome.length < 3) {
            erroNome.textContent = "Nome tem que ter no mínimo 3 caracteres.";
            erroNome.style.color = "white";
            nomeValidado = false;
        } else if (nome.length > 30) {
            erroNome.textContent = "Nome tem que ter no máximo 30 caracteres.";
            erroNome.style.color = "white";
            nomeValidado = false;
        } else {
            erroNome.textContent = "";
            nomeValidado = true;
        }
        
        if (senha.length < 5) {
            erroSenha.textContent = "A senha tem que ter no mínimo 5 caracteres.";
            erroSenha.style.color = "white";
            senhaValidada = false;
        } else {
            erroSenha.textContent = "";
            senhaValidada = true;
        }
    
        if (senhaValidada){
            if (senha !== resenha) {
                senhaIgual.textContent = "As senhas não coincidem.";
                senhaIgual.style.color = "white";
                senhaValidada = false;
            } else {
                senhaIgual.textContent = "";
                senhaValidada = true;
            }
        }
        
        
        if (!validarEmail(email)) {
            erroEmail.textContent = "O e-mail tem que ser válido.";
            erroEmail.style.color = "white";
            emailValidado = false;
        } else {
            if((await Emailexiste(email)) === "email"){
                erroEmail.textContent = "O e-mail já está cadastrado.";
                erroEmail.style.color = "white";
                emailValidado = false;
            }
            else {
                erroEmail.textContent = "";
                emailValidado = true;
            }
        }

        const form = document.getElementById('form-cadastro');
        const formData = new FormData(form);
        let token = formData.get('cf-turnstile-response');
        

        if (nomeValidado && senhaValidada && emailValidado) {
            let resultado = await darFetch(nome, email, cpf, senha, token);
            if (resultado === "ok") {
                console.log("Cadastro realizado com sucesso!");
                window.location.href = "login.html";
            } else {
                console.log("Erro ao cadastrar. Verifique os dados ou o CAPTCHA.");
            }
        }
    });
        
</script>
</body>
</html>
