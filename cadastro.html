<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="shortcut icon" href="img/Logo-Circular-Chapa-Quente.ico">
    <link rel="stylesheet" href="style-cadastro.css">
</head>

<body>
    <div class="boxzinho">
    <img src="img/Ícone Glossy de Adicionar Usuário.png" alt="">
    <h1>Cadastro</h1>
    <p class="topo">
        Crie sua conta para começar
    </p>

    <form>

    <div class="nome">
        <img src="img/Ícone_de_usuário_branco_brilhante-removebg-preview.png" alt="">
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
    </div>

    <p id="erronome"></p>

    <div class="cpf">
        <img src="img/Ícone_de_usuário_branco_brilhante-removebg-preview.png" alt="">
        <input type="text" id="CPF" name="CPF" placeholder="Digite seu CPF" maxlength="14" inputmode="numeric" autocomplete="off">
    </div>

    <p id="errocpf"></p>

    <div class="e-mail">
        <img src="img/Ícone de Envelope Branco Minimalista.png" alt="">
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" autocomplete="off">
    </div>

    <p id="erroEmail"></p>

    <div class="senha">
        
        <img src="img/Ícone de Cadeado Branco Minimalista.png" alt="">
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha">
        <button type="button" id="mostrar" class="mostrarsenha"></button>
        

    </div>

    <p id="errosenha"></p>

    <div class="c-senha">
        <img src="img/Ícone de Cadeado Branco Minimalista.png" alt="">
        <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Digite sua senha novamente">
        <button type="button" id="mostrar2" class="mostrarsenha-2"></button>

    </div>
    <p id="senhaigual"></p>

    <div class="cf-turnstile"
         data-sitekey="0x4AAAAAAFrjVcpO6gvC-ZML"
         data-callback="turnstileSuccess"
         data-expired-callback="turnstileExpired"
         data-error-callback="turnstileError"></div>
    <p id="erroCaptcha" role="status" style="color: white;"></p>

    <div>
        <button type="submit" id="cadastro">Cadastrar</button>
    </div>

    </form>

    <p>
        Já possui uma conta?
        <a href="login.html">Entrar</a>
    </p>
    </div>

    <script>
        window.turnstileToken = '';

        window.turnstileSuccess = function(token) {
            window.turnstileToken = token;
            document.getElementById('erroCaptcha').textContent = '';
        };

        window.turnstileExpired = function() {
            window.turnstileToken = '';
            document.getElementById('erroCaptcha').textContent =
                'A verificação expirou. Faça o CAPTCHA novamente.';
        };

        window.turnstileError = function() {
            window.turnstileToken = '';
            document.getElementById('erroCaptcha').textContent =
                'Não foi possível carregar o CAPTCHA.';
        };
    </script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer onerror="turnstileError()"></script>

    <script type="module">
        import { validarEmail, validarCPF } from "./funcoes.js";
        import { darFetch, CpfEmailexiste } from "./fetchs.js";

        function configurarMostrarSenha(botaoId, inputId) {
            const botao = document.getElementById(botaoId);
            const campo = document.getElementById(inputId);
            let visivel = false;

            botao.addEventListener("click", function() {
                visivel = !visivel;
                campo.type = visivel ? "text" : "password";
                botao.style.backgroundImage = visivel
                    ? "url('img/Ícone de Olho Branco Minimalista.png')"
                    : "url('img/Ícone de olho oculto minimalista.png')";
            });
        }

        configurarMostrarSenha("mostrar", "senha");
        configurarMostrarSenha("mostrar2", "confirmar-senha");

        const form = document.querySelector("form");
        const botaoCadastro = document.getElementById("cadastro");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const nome = document.getElementById("nome").value.trim();
            const cpf = document.getElementById("CPF").value.trim();
            const email = document.getElementById("email").value.trim();
            const senha = document.getElementById("senha").value;
            const confirmarSenha = document.getElementById("confirmar-senha").value;

            const erroNome = document.getElementById("erronome");
            const erroCpf = document.getElementById("errocpf");
            const erroEmail = document.getElementById("erroEmail");
            const erroSenha = document.getElementById("errosenha");
            const erroConfirmacao = document.getElementById("senhaigual");
            const erroCaptcha = document.getElementById("erroCaptcha");

            erroNome.textContent = nome.length < 3 || nome.length > 30
                ? "Nome deve ter entre 3 e 30 caracteres." : "";
            erroCpf.textContent = validarCPF(cpf) ? "" : "Seu CPF não está correto ou é inválido.";
            erroEmail.textContent = validarEmail(email) ? "" : "O e-mail tem que ser válido.";
            erroSenha.textContent = senha.length < 8 ? "A senha deve ter no mínimo 8 caracteres." : "";
            erroConfirmacao.textContent = senha === confirmarSenha ? "" : "As senhas não coincidem.";

            [erroNome, erroCpf, erroEmail, erroSenha, erroConfirmacao].forEach(elemento => {
                elemento.style.color = "white";
            });

            const formularioValido =
                nome.length >= 3 && nome.length <= 30 &&
                validarCPF(cpf) &&
                validarEmail(email) &&
                senha.length >= 8 &&
                senha === confirmarSenha;

            if (!formularioValido) return;

            if (!window.turnstileToken) {
                erroCaptcha.textContent = window.turnstile
                    ? "Complete o CAPTCHA antes de cadastrar."
                    : "O CAPTCHA não foi carregado. Atualize a página e tente novamente.";
                return;
            }

            botaoCadastro.disabled = true;
            botaoCadastro.textContent = "Cadastrando...";

            try {
                const existente = await CpfEmailexiste(cpf, email);

                if (existente === "email usado") {
                    alert("Este e-mail já está sendo usado!");
                    return;
                }

                if (existente === "cpf usado") {
                    alert("Este CPF já está sendo usado!");
                    return;
                }

                const resultado = await darFetch(nome, email, cpf, senha, window.turnstileToken);

                if (resultado.ok) {
                    alert("Cadastro realizado com sucesso!");
                    window.location.href = "login.html";
                } else {
                    erroCaptcha.textContent = typeof resultado.erro === "string"
                        ? resultado.erro
                        : "Não foi possível realizar o cadastro. Tente novamente.";
                    if (window.turnstile) window.turnstile.reset();
                    window.turnstileToken = "";
                }
            } catch (erro) {
                console.error(erro);
                alert("Não foi possível verificar os dados ou conectar ao servidor.");
                if (window.turnstile) window.turnstile.reset();
                window.turnstileToken = "";
            } finally {
                botaoCadastro.disabled = false;
                botaoCadastro.textContent = "Cadastrar";
            }
        });

    </script>
</body>
</html>
