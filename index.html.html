<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Site</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #2b6cb0;
            margin-bottom: 12px;
            font-size: 2rem;
        }

        p {
            color: #4a5568;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        .footer {
            margin-top: 24px;
            font-size: 0.875rem;
            color: #a0aec0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Olá, mundo! 👋</h1>
        <p>Bem-vindo ao meu site hospedado no GitHub Pages.</p>
        <div class="footer">
            <p>Criado com sucesso!</p>
        </div>
    </div>

</body>
</html>
